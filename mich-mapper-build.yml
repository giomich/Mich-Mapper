name: Mich Mapper Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Installa .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Crea progetto
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path MichMapper | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <AssemblyName>MichMapper</AssemblyName>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Path MichMapper/MichMapper.csproj -Encoding UTF8

          @'
          using System;
          using System.Drawing;
          using System.Windows.Forms;

          namespace MichMapper;

          internal static class Program
          {
              [STAThread]
              static void Main()
              {
                  ApplicationConfiguration.Initialize();
                  Application.Run(new MainForm());
              }
          }

          public sealed class MainForm : Form
          {
              public MainForm()
              {
                  Text = "Mich Mapper 2.0";
                  StartPosition = FormStartPosition.CenterScreen;
                  Width = 900;
                  Height = 600;

                  var titolo = new Label
                  {
                      Text = "Mich Mapper 2.0",
                      AutoSize = true,
                      Font = new Font("Segoe UI", 22, FontStyle.Bold),
                      Location = new Point(35, 30)
                  };

                  var testo = new Label
                  {
                      Text = "Prima versione Windows compilata correttamente.",
                      AutoSize = true,
                      Font = new Font("Segoe UI", 11),
                      Location = new Point(40, 85)
                  };

                  var pulsante = new Button
                  {
                      Text = "Seleziona cartella PDF",
                      Width = 220,
                      Height = 45,
                      Location = new Point(40, 140)
                  };

                  pulsante.Click += (_, _) =>
                  {
                      using var dialog = new FolderBrowserDialog();

                      if (dialog.ShowDialog() == DialogResult.OK)
                      {
                          MessageBox.Show(
                              "Cartella selezionata:\n" + dialog.SelectedPath,
                              "Mich Mapper");
                      }
                  };

                  Controls.Add(titolo);
                  Controls.Add(testo);
                  Controls.Add(pulsante);
              }
          }
          '@ | Set-Content -Path MichMapper/Program.cs -Encoding UTF8

      - name: Compila programma Windows
        shell: pwsh
        run: |
          dotnet publish MichMapper/MichMapper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Carica programma
        uses: actions/upload-artifact@v4
        with:
          name: Mich-Mapper-v2.0-Test2
          path: publish/
